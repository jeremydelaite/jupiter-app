name: Supabase keep-alive

# Empêche la mise en pause automatique du projet Supabase (plan gratuit)
# en envoyant une requête légère sur la base une fois par semaine.

on:
  schedule:
    # Tous les lundis à 07:12 UTC (heure décalée pour éviter les pics de charge GitHub)
    - cron: "12 7 * * 1"
  workflow_dispatch: {}   # permet aussi de le lancer manuellement depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (garde le projet actif)
        env:
          SUPABASE_URL: "https://sfbpxtuvveicsrevhcrk.supabase.co"
          # Clé "anon public" — déjà présente côté client dans index.html, donc non secrète.
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmYnB4dHV2dmVpY3NyZXZoY3JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NTQ1NTMsImV4cCI6MjEwMDIzMDU1M30.r5VjQIAHdMfqqYBde9UGe6tS6BNfxOKevFXFNZYpfBg"
        run: |
          echo "Ping de la base Supabase pour la garder active…"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/jupiter_data?select=user_id&limit=1")
          echo "Code HTTP reçu : $code"
          # 200 (ok) ou 401/403 (RLS) comptent comme de l'activité et suffisent.
          if [ "$code" = "000" ]; then
            echo "::error::Aucune réponse de Supabase (projet en pause ou injoignable)."
            exit 1
          fi
          echo "Base joignable — projet maintenu actif."
